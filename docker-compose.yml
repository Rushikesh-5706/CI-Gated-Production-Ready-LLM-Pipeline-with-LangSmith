services:
  api:
    build: .
    image: rushi5706/ci-gated-llm-pipeline:latest
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:${PORT:-8000}"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - LANGCHAIN_API_KEY=${LANGCHAIN_API_KEY:-}
      - LANGCHAIN_TRACING_V2=${LANGCHAIN_TRACING_V2:-true}
      - LANGCHAIN_PROJECT=${LANGCHAIN_PROJECT:-ci-gated-llm-pipeline}
      - LLM_MODEL=${LLM_MODEL:-qwen/qwen3.8-27b}
      - JUDGE_MODEL=${JUDGE_MODEL:-qwen/qwen3.8-27b}
      - PORT=${PORT:-8000}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - DEFAULT_ENVIRONMENT=${DEFAULT_ENVIRONMENT:-staging}
      - LLM_TIMEOUT_SECONDS=${LLM_TIMEOUT_SECONDS:-30}
      - LLM_REQUESTS_PER_MINUTE=${LLM_REQUESTS_PER_MINUTE:-25}
      - LLM_TOKENS_PER_MINUTE=${LLM_TOKENS_PER_MINUTE:-5000}
      - LLM_MAX_RETRIES=${LLM_MAX_RETRIES:-6}
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:${PORT:-8000}/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
