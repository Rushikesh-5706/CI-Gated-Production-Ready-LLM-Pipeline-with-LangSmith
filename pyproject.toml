[project]
name = "ci-gated-llm-pipeline"
requires-python = ">=3.11"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "SIM108", "SIM105", "B007", "RUF200"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
